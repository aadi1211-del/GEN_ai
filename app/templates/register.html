{% extends "base.html" %}
{% block title %}Sign Up — NeuraForge{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="nf-card p-4 p-md-5 mt-4">
        <h3 class="fw-bold mb-1 text-center">Create your account</h3>
        <p class="text-secondary text-center mb-4 small">Start chatting with AI in under a minute</p>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control nf-input" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control nf-input" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control nf-input" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control nf-input" required>
          </div>
          <button type="submit" class="btn nf-btn-primary w-100">Create Account</button>
        </form>

        <p class="text-center text-secondary small mt-4 mb-0">
          Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
